---
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Build and publish the release with goreleaser. This job holds all of the
  # build steps; the provenance is generated by a separate, dedicated job so
  # nothing that runs here shares the attester's runner or signing identity.
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # create the release and upload the binaries and the SBOM

    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Set tag output
        id: tag
        run: echo "tag_name=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        id: goreleaser
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The SBOM is pushed to the release, so the attester picks it up as
      # one more release asset when it attests the run.
      - name: Generate SBOM
        id: sbom
        uses: carabiner-dev/actions/unpack/sbom@d41fe10fe88deaf493ce026007da73738b9f570c # v1.3.0
        with:
          push-to-release: ${{ steps.tag.outputs.tag_name }}
          # goreleaser leaves its build output under dist/, which unpack
          # would otherwise scan while discovering codebases.
          ignore: dist
        env:
          GH_TOKEN: ${{ github.token }}

  # Attest the release with the SLSA attester: the reusable workflow gives
  # the attester a dedicated job and signs the provenance with the
  # slsa-framework/actions identity (the observer pattern). goreleaser
  # publishes straight to the release, so the run's workflow artifact store
  # is empty and the subjects come from the release assets. Only the release
  # job is watched: the publish job below depends on this one, so watching
  # it would deadlock.
  provenance:
    needs: release
    permissions:
      id-token: write # sigstore keyless signing
      actions: read   # read the run's jobs
      contents: read
    uses: slsa-framework/actions/.github/workflows/attest_actions.yml@main
    with:
      watch-jobs: release
      collect-artifacts: false
      release: ${{ needs.release.outputs.tag_name }}
      # Run a released, provenance-verified attester rather than building
      # it from source.
      build-from-source: false
      version: v0.1.0-rc.3

  # Publish the provenance to the release. The slsa_with_provenance action
  # in slsa-framework/actions verifies the downloaded binary against this
  # file, so it must land on the release as attestations.intoto.jsonl
  # (the name every SLSA tool publishes its release provenance under;
  # releases up to v0.7.1 used sourcetool.intoto.jsonl).
  publish:
    needs: [release, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the attestation to the release
    steps:
      - name: Download the attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slsa-attestations

      - name: Publish provenance to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        run: |
          mv provenance.intoto.json attestations.intoto.jsonl
          gh release upload "${TAG_NAME}" attestations.intoto.jsonl
